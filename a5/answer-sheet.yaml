ss_REG_AltPlot_CODE_0: "#!/usr/bin/env python3\n\"\"\"\nPlot position and velocity magnitudes for SGP4, integrated, and optimized\
  \ orbits.\n\"\"\"\n\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom pathlib import Path\n\ndef load_orbit_data(filename):\n\
  \    \"\"\"Load orbit data from file.\"\"\"\n    data = np.loadtxt(filename, comments='#')\n    times = data[:, 0]\n   \
  \ positions = data[:, 1:4]\n    velocities = data[:, 4:7]\n    return times, positions, velocities\n\ndef main():\n    print(\"\
  =\"*60)\n    print(\"Position and Velocity Magnitudes Analysis\")\n    print(\"=\"*60)\n    print()\n    \n    # Load orbit\
  \ data\n    print(\"Loading orbit data...\")\n    \n    # SGP4 orbit\n    print(\"  - Loading SGP4 orbit...\")\n    sgp4_data\
  \ = np.load('data/sgp4_reference/orbit_propagation.npz')\n    times_jd = sgp4_data['times_jd']\n    jd_full = times_jd[:,\
  \ 0] + times_jd[:, 1]\n    times_sgp4 = (jd_full - jd_full[0]) * 86400.0  # seconds\n    pos_sgp4 = sgp4_data['positions']\
  \ * 1000.0  # km to m\n    vel_sgp4 = sgp4_data['velocities'] * 1000.0  # km/s to m/s\n    \n    # Integrated orbit\n  \
  \  print(\"  - Loading integrated orbit...\")\n    times_int, pos_int, vel_int = load_orbit_data('data/outputs_all/integrated_orbit.txt')\n\
  \    \n    # Optimized orbit\n    print(\"  - Loading optimized orbit...\")\n    times_opt, pos_opt, vel_opt = load_orbit_data('data/outputs_all/optimized_orbit.txt')\n\
  \    \n    # Convert times to hours\n    times_sgp4_hr = times_sgp4 / 3600.0\n    times_int_hr = times_int / 3600.0\n  \
  \  times_opt_hr = times_opt / 3600.0\n    \n    # Compute magnitudes\n    print()\n    print(\"Computing magnitudes...\"\
  )\n    r_mag_sgp4 = np.linalg.norm(pos_sgp4, axis=1) / 1000.0  # km\n    v_mag_sgp4 = np.linalg.norm(vel_sgp4, axis=1) \
  \ # m/s\n    \n    r_mag_int = np.linalg.norm(pos_int, axis=1) / 1000.0  # km\n    v_mag_int = np.linalg.norm(vel_int, axis=1)\
  \  # m/s\n    \n    r_mag_opt = np.linalg.norm(pos_opt, axis=1) / 1000.0  # km\n    v_mag_opt = np.linalg.norm(vel_opt,\
  \ axis=1)  # m/s\n    \n    # Find common time range to avoid extrapolation issues\n    t_max_common = min(times_sgp4[-1],\
  \ times_int[-1], times_opt[-1])\n    sgp4_mask = times_sgp4 <= t_max_common\n    times_sgp4_common = times_sgp4[sgp4_mask]\n\
  \    pos_sgp4_common = pos_sgp4[sgp4_mask]\n    vel_sgp4_common = vel_sgp4[sgp4_mask]\n    \n    print(f\"  Using common\
  \ time range: 0 to {t_max_common:.1f} s ({len(times_sgp4_common)} points)\")\n    \n    # Interpolate integrated and optimized\
  \ to common SGP4 times for difference calculation\n    pos_int_interp = np.array([np.interp(times_sgp4_common, times_int,\
  \ pos_int[:, i]) for i in range(3)]).T\n    vel_int_interp = np.array([np.interp(times_sgp4_common, times_int, vel_int[:,\
  \ i]) for i in range(3)]).T\n    \n    pos_opt_interp = np.array([np.interp(times_sgp4_common, times_opt, pos_opt[:, i])\
  \ for i in range(3)]).T\n    vel_opt_interp = np.array([np.interp(times_sgp4_common, times_opt, vel_opt[:, i]) for i in\
  \ range(3)]).T\n    \n    # Compute difference vectors, then their magnitudes\n    pos_diff_int = pos_int_interp - pos_sgp4_common\n\
  \    pos_diff_opt = pos_opt_interp - pos_sgp4_common\n    vel_diff_int = vel_int_interp - vel_sgp4_common\n    vel_diff_opt\
  \ = vel_opt_interp - vel_sgp4_common\n    \n    r_diff_mag_int = np.linalg.norm(pos_diff_int, axis=1) / 1000.0  # km\n \
  \   r_diff_mag_opt = np.linalg.norm(pos_diff_opt, axis=1) / 1000.0  # km\n    v_diff_mag_int = np.linalg.norm(vel_diff_int,\
  \ axis=1)  # m/s\n    v_diff_mag_opt = np.linalg.norm(vel_diff_opt, axis=1)  # m/s\n    \n    print()\n    print(\"Creating\
  \ plots...\")\n    \n    # Plot 1: Position magnitude\n    fig, ax1 = plt.subplots(figsize=(12, 7))\n    \n    # Primary\
  \ y-axis: position magnitudes\n    ax1.plot(times_sgp4_hr, r_mag_sgp4, 'b-', label='SGP4', linewidth=2, alpha=0.8)\n   \
  \ ax1.plot(times_int_hr, r_mag_int, 'g--', label='Integrated', linewidth=1.5, alpha=0.7)\n    ax1.plot(times_opt_hr, r_mag_opt,\
  \ 'r:', label='Optimized', linewidth=1.5, alpha=0.7)\n    ax1.set_xlabel('Time [hours]', fontsize=12, fontweight='bold')\n\
  \    ax1.set_ylabel('Position Magnitude [km]', fontsize=12, fontweight='bold', color='k')\n    ax1.tick_params(axis='y',\
  \ labelcolor='k')\n    ax1.grid(True, alpha=0.3)\n    \n    # Secondary y-axis: difference magnitudes\n    ax2 = ax1.twinx()\n\
  \    times_sgp4_hr_common = times_sgp4_common / 3600.0\n    ax2.plot(times_sgp4_hr_common, r_diff_mag_int, 'm-', label='Integrated\
  \ - SGP4', linewidth=1.5, alpha=0.7)\n    ax2.plot(times_sgp4_hr_common, r_diff_mag_opt, 'orange', linestyle='-', label='Optimized\
  \ - SGP4', linewidth=1.5, alpha=0.7)\n    ax2.set_ylabel('Position Difference Magnitude [km]', fontsize=12, fontweight='bold',\
  \ color='purple')\n    ax2.tick_params(axis='y', labelcolor='purple')\n    \n    # Title\n    plt.title('Position Magnitude\
  \ Evolution', fontsize=14, fontweight='bold', pad=20)\n    \n    # Combined legend\n    lines1, labels1 = ax1.get_legend_handles_labels()\n\
  \    lines2, labels2 = ax2.get_legend_handles_labels()\n    ax1.legend(lines1 + lines2, labels1 + labels2, loc='upper left',\
  \ \n               bbox_to_anchor=(1.15, 1), framealpha=0.95, fontsize=9, \n               edgecolor='gray')\n    \n   \
  \ # Adjust layout to prevent label clipping\n    plt.tight_layout(rect=[0, 0, 0.85, 0.96])\n    \n    output_file = 'plots/magnitudes/position_magnitude.png'\n\
  \    Path(output_file).parent.mkdir(parents=True, exist_ok=True)\n    plt.savefig(output_file, dpi=300, bbox_inches='tight')\n\
  \    print(f\"  Saved: {output_file}\")\n    \n    # Print statistics\n    print(f\"    Position RMS difference (Integrated):\
  \ {np.sqrt(np.mean(r_diff_mag_int**2)):.6f} km\")\n    print(f\"    Position RMS difference (Optimized):  {np.sqrt(np.mean(r_diff_mag_opt**2)):.6f}\
  \ km\")\n    \n    # Plot 2: Velocity magnitude\n    fig, ax1 = plt.subplots(figsize=(12, 7))\n    \n    # Primary y-axis:\
  \ velocity magnitudes\n    ax1.plot(times_sgp4_hr, v_mag_sgp4, 'b-', label='SGP4', linewidth=2, alpha=0.8)\n    ax1.plot(times_int_hr,\
  \ v_mag_int, 'g--', label='Integrated', linewidth=1.5, alpha=0.7)\n    ax1.plot(times_opt_hr, v_mag_opt, 'r:', label='Optimized',\
  \ linewidth=1.5, alpha=0.7)\n    ax1.set_xlabel('Time [hours]', fontsize=12, fontweight='bold')\n    ax1.set_ylabel('Velocity\
  \ Magnitude [m/s]', fontsize=12, fontweight='bold', color='k')\n    ax1.tick_params(axis='y', labelcolor='k')\n    ax1.grid(True,\
  \ alpha=0.3)\n    \n    # Secondary y-axis: difference magnitudes\n    ax2 = ax1.twinx()\n    ax2.plot(times_sgp4_hr_common,\
  \ v_diff_mag_int, 'm-', label='Integrated - SGP4', linewidth=1.5, alpha=0.7)\n    ax2.plot(times_sgp4_hr_common, v_diff_mag_opt,\
  \ 'orange', linestyle='-', label='Optimized - SGP4', linewidth=1.5, alpha=0.7)\n    ax2.set_ylabel('Velocity Difference\
  \ Magnitude [m/s]', fontsize=12, fontweight='bold', color='purple')\n    ax2.tick_params(axis='y', labelcolor='purple')\n\
  \    \n    # Title\n    plt.title('Velocity Magnitude Evolution', fontsize=14, fontweight='bold', pad=20)\n    \n    # Combined\
  \ legend\n    lines1, labels1 = ax1.get_legend_handles_labels()\n    lines2, labels2 = ax2.get_legend_handles_labels()\n\
  \    ax1.legend(lines1 + lines2, labels1 + labels2, loc='upper left', \n               bbox_to_anchor=(1.15, 1), framealpha=0.95,\
  \ fontsize=9, \n               edgecolor='gray')\n    \n    # Adjust layout to prevent label clipping\n    plt.tight_layout(rect=[0,\
  \ 0, 0.85, 0.96])\n    \n    output_file = 'plots/magnitudes/velocity_magnitude.png'\n    plt.savefig(output_file, dpi=300,\
  \ bbox_inches='tight')\n    print(f\"  Saved: {output_file}\")\n    \n    # Print statistics\n    print(f\"    Velocity\
  \ RMS difference (Integrated): {np.sqrt(np.mean(v_diff_mag_int**2)):.6f} m/s\")\n    print(f\"    Velocity RMS difference\
  \ (Optimized):  {np.sqrt(np.mean(v_diff_mag_opt**2)):.6f} m/s\")\n    \n    print()\n    print(\"=\"*60)\n    print(\"Analysis\
  \ complete!\")\n    print(\"=\"*60)\n\nif __name__ == '__main__':\n    main()\n"
