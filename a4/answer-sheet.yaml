ss_REG_SRPInt_OIC_8: '

  1. Because the SRP magnitude stays constant while the X, Y and Z components vary
  periodically, the SRP acceleration behaves as a constant-strength vector whose direction
  rotates once per orbital period.


  2. Since the spacecraft remains in full sunlight and the SRP magnitude does not
  change over the 72 hours, any time variation in the SRP components is caused by
  the changing geometry between the spacecraft and the Sun, not by shadow passages.

  '
ss_REG_SRPCon_OIC_10: '

  When solar radiation pressure acts continuously with nearly constant magnitude,
  it behaves as a steady perturbing force whose direction changes with the orbital
  motion rather than as an on/off disturbance driven by eclipses.

  '
