ss_REG_OrbObs_OIC_10: "\n1. (plots/optimization/convergence.png) The CGPD decreases more rapidly per iteration (on average)\
  \ in the initial ~30 iterations than in the rest of the optimization. \n\n2. (plots/magnitudes/position_magnitude.png) The\
  \ absolute value of the position magnitude error is always lower for the optimized orbit compared to the integrated orbit\
  \ for the period studied.\n\n3. (plots/magnitudes/position_magnitude.png & plots/magnitudes/velocity_magnitude.png) Position\
  \ initial difference is equal to 0 for both integrated and optimized orbits but velocity initial difference is only zero\
  \ for the integrated orbit.\n"
ss_REG_OrbInt_OIC_15: "\n    \n1. A lower position difference magnitude through the entire time span implies a lower CGPD\
  \ value, as per CGPD definition.\n\n2. The stalling in CGPD reduction suggests the optimizer may have reached a local minimum.\
  \ \n"
ss_REG_OrbCon_OIC_23: "\nThe optimized orbit will always have a greater or equal difference (in position and/or velocity)\
  \ than the integrated orbit at the initial time, since the change of the initial state vector is the only way to reduce\
  \ the CGPD in this assignment.    \n"
