ss_REG_MagPlot_CODE_1: "\ndef plot_disturbance_magnitudes(accelerations, time_hours,\
  \ perturbation_name, output_dir):\n    # Compute magnitude of acceleration vectors\n\
  \    magnitudes = np.linalg.norm(accelerations, axis=1)\n    \n    # Create plot\n\
  \    fig, ax = plt.subplots(figsize=(16, 6))\n    ax.plot(time_hours, magnitudes,\
  \ linewidth=1.5)\n    ax.set_xlabel('Time [hours]')\n    ax.set_ylabel('Acceleration\
  \ magnitude [m/s²]')\n    ax.set_title(f'{perturbation_name} Disturbance Acceleration\
  \ Magnitude')\n    ax.grid(True, alpha=0.3)\n    \n    plt.tight_layout()\n    plt.savefig(f'{output_dir}/{perturbation_name.lower()}_magnitude.png',\
  \ dpi=300)\n"
