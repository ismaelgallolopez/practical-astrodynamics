ss_REG_SRP_CODE_2.5: "\nsubroutine srp_acceleration(r, r_sun, a_srp)\n    real(8),\
  \ intent(in) :: r(3), r_sun(3)\n    real(8), intent(out) :: a_srp(3)\n    real(8)\
  \ :: r_sat_sun(3), d, f_g, P_srp\n    real(8), parameter :: CR_OVER_M = 0.02  !\
  \ m^2/kg\n    real(8), parameter :: SOLAR_FLUX = 1361.0  ! W/m^2\n    real(8), parameter\
  \ :: C_LIGHT = 3.0e+08  ! m/s\n    real(8), parameter :: R_EARTH = 6.4e+06\n   \
  \ \n    ! Vector from satellite to Sun\n    r_sat_sun = r_sun - r\n    d = sqrt(r_sat_sun(1)**2\
  \ + r_sat_sun(2)**2 + r_sat_sun(3)**2)\n    \n    ! Compute shadow factor (geometric)\n\
  \    call compute_shadow_factor(r, r_sun, f_g)\n    \n    ! SRP pressure\n    P_srp\
  \ = SOLAR_FLUX / C_LIGHT\n    \n    ! Acceleration\n    a_srp = f_g * CR_OVER_M\
  \ * P_srp * r_sat_sun / d\nend subroutine srp_acceleration\n"
