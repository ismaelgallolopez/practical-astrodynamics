ss_REG_Grav_CODE_1: "module gravity\n    implicit none\n    \n    ! Parameters\n \
  \   integer, parameter :: dp = selected_real_kind(15, 307)\n    real(dp), parameter\
  \ :: mu_earth = 3.986004418e14_dp  ! Earth's gravitational parameter [m^3/s^2]\n\
  \    \ncontains\n\n    ! Compute 3D gravitational acceleration from point mass\n\
  \    ! Input: position vector r [m]\n    ! Output: acceleration vector a [m/s^2]\n\
  \    function gravitational_acceleration(r) result(a)\n        real(dp), intent(in)\
  \ :: r(3)\n        real(dp) :: a(3)\n        real(dp) :: r_mag\n        \n     \
  \   ! Compute distance from Earth center\n        r_mag = sqrt(r(1)**2 + r(2)**2\
  \ + r(3)**2)\n        \n        ! Compute gravitational acceleration: a = -mu *\
  \ r / |r|^3\n        a = -mu_earth * r / r_mag**3\n        \n    end function gravitational_acceleration\n\
  \nend module gravity\n"
