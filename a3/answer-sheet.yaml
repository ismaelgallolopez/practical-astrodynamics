ss_AEX_Alt_CODE_2: "module velocity_verlet_integrator_module\n    use gravity\n  \
  \  implicit none\n\ncontains\n\n    ! Velocity Verlet integrator subroutine\n  \
  \  ! Inputs:\n    !   - state0(6): initial state vector [x, y, z, vx, vy, vz]\n\
  \    !   - dt: time step [s]\n    !   - t_stop: stop time [s]\n    !   - accel_func:\
  \ function that computes acceleration from position\n    ! Outputs:\n    !   - t_array:\
  \ array of time values\n    !   - state_array: array of state vectors at each time\
  \ step\n    !   - n_steps: number of time steps\n    subroutine velocity_verlet_integrate(state0,\
  \ dt, t_stop, accel_func, t_array, state_array, n_steps)\n        real(dp), intent(in)\
  \ :: state0(6)\n        real(dp), intent(in) :: dt\n        real(dp), intent(in)\
  \ :: t_stop\n        integer, intent(out) :: n_steps\n        real(dp), allocatable,\
  \ intent(out) :: t_array(:)\n        real(dp), allocatable, intent(out) :: state_array(:,:)\n\
  \n        interface\n            function accel_func(r) result(a)\n            \
  \    import :: dp\n                real(dp), intent(in) :: r(3)\n              \
  \  real(dp) :: a(3)\n            end function accel_func\n        end interface\n\
  \n        integer :: i\n        real(dp) :: t_current\n        real(dp) :: r(3),\
  \ v(3)\n        real(dp) :: a_n(3), a_np1(3)\n        real(dp) :: r_new(3), v_new(3)\n\
  \        real(dp) :: dt2\n\n        ! Calculate number of steps\n        n_steps\
  \ = int(t_stop / dt) + 1\n\n        ! Allocate output arrays\n        allocate(t_array(n_steps))\n\
  \        allocate(state_array(6, n_steps))\n\n        ! Precompute dt^2\n      \
  \  dt2 = dt * dt\n\n        ! Initialize first state\n        t_array(1)      =\
  \ 0.0_dp\n        state_array(:,1) = state0\n\n        ! Velocity Verlet integration\
  \ loop\n        do i = 1, n_steps - 1\n            ! Current time\n            t_current\
  \ = t_array(i)\n\n            ! Extract position and velocity at step i\n      \
  \      r = state_array(1:3, i)\n            v = state_array(4:6, i)\n\n        \
  \    ! Acceleration at current position: a_n = a(r_n)\n            a_n = accel_func(r)\n\
  \n            ! --- Position update ---\n            ! r_{n+1} = r_n + dt*v_n +\
  \ 0.5*dt^2*a_n\n            r_new = r + dt * v + 0.5_dp * dt2 * a_n\n\n        \
  \    ! Acceleration at new position: a_{n+1} = a(r_{n+1})\n            a_np1 = accel_func(r_new)\n\
  \n            ! --- Velocity update ---\n            ! v_{n+1} = v_n + 0.5*dt*(a_n\
  \ + a_{n+1})\n            v_new = v + 0.5_dp * dt * (a_n + a_np1)\n\n          \
  \  ! Store updated state\n            state_array(1:3, i+1) = r_new\n          \
  \  state_array(4:6, i+1) = v_new\n\n            ! Update time\n            t_array(i+1)\
  \ = t_current + dt\n        end do\n\n    end subroutine velocity_verlet_integrate\n\
  \nend module velocity_verlet_integrator_module\n"
