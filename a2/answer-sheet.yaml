ss_AEX_OrbECFInt_OIC_4: '1. The figure-8 ground track pattern is characteristic of inclined
  geosynchronous orbits where the 13º inclination causes the satellite to oscillate north-south
  of the equatorial plane, while the orbit''s small eccentricity (e ≈ 0.0001) produces east-west
  oscillations, creating the closed analemma pattern that repeats daily.


  2. The eastward longitude drift of 0.0065º/day indicates the satellite''s actual orbital
  period is slightly longer than Earth''s sidereal rotation period (86,164.1 seconds), causing
  the subsatellite point to shift eastward by approximately 2.4º per year unless corrected
  by station-keeping maneuvers.'
