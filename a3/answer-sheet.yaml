ss_AEX_AltObs_OIC_1.5: "1. (keplerian_comparison_inclination.png) The inclination\
  \ residuals between Velocity Verlet and Euler implementations are on the order of\
  \ 1e-13 degrees (much smaller than inclination values on the order of 1e1) and show\
  \ a quasi-random pattern. \n        \n        2. (cgpd_vs_timestep_verlet.png) Unlike\
  \ in the Euler implementation, the Velocity Verlet method shows a minimum in CGPD\
  \ at an dt=300 s.\n\n        3. (verlet_position_magnitude.png) Verlet's orbital\
  \ radius drift is negligible when compared to Euler's at both dt=100s and 500s."
ss_AEX_AltInt_OIC_2.5: "1. The stability of the orbital radius confirms that the Velocity\
  \ Verlet algorithm acts as a geometric integrator. Its symplectic nature ensures\
  \ the conservation of the system's Hamiltonian, preventing the artificial orbital\
  \ decay/expansion seen in non-symplectic methods like Euler.\n        \n       \
  \ 2. The minimum in the CGPD curve at dt=300 s marks the crossover point between\
  \ two distinct error regimes. Below this threshold, the total error is dominated\
  \ by the accumulation of floating-point round-off errors (due to the excessive number\
  \ of integration steps). Above this threshold, the error is dominated by the truncation\
  \ error of the algorithm (which scales as O(Delta_t^2)). The observed minimum represents\
  \ the optimal step size among the ones used for the study where the combined effect\
  \ of both error sources is minimized."
ss_AEX_AltCon_OIC_4: In the context of this assignment, the Velocity Verlet method
  outperforms Euler in accuracy and stability for orbit propagation under a point-mass
  Earth model
ss_CEX_Explain_GEN_10: 'Code Excellence Features:


  1. Fortran-Python Integration - Fortran prints parseable timing format, Python extracts
  with regex for automated performance benchmarking


  2. Object-Oriented Programming with Type Hints - OrbitPropagator class with @dataclass
  for KeplerianElements, full type annotations throughout (numpy.ndarray, Optional,
  Tuple) for maintainability and static analysis


  3. ArgumentParser CLI Interface - Professional command-line interface in fetch_tle.py
  with subcommands, custom URLs, and validation modes for automated TLE retrieval


  4. Automated Answer Sheet Generation - 542-line script reads assignment requirements,
  extracts 40+ answer keys programmatically using regex, glob patterns, and automatic
  file discovery


  5. Polymorphic File Loading - OrbitDataLoader class handles NPZ and TXT formats
  with auto-detection via load_from_file(), returns consistent (times, positions,
  velocities, name) tuple regardless of source format


  6. Comprehensive Docstrings - 100+ docstrings following Google style across all
  modules (~1500 lines of documentation)


  7. Intelligent Directory Organization - Automatic subdirectory creation with systematic
  naming (dt{N}s_{method}_output.txt), plots organized by method and timestep


  8. Smart Caching and Conditional Execution - Shell scripts check existing files,
  skip recomputation, only recompile if sources changed, batch processing support


