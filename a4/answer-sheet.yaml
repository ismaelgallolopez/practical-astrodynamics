  72-hour interval, and the difference curve remains close to zero without showing
  any visible trend.


  2. (plots/j2_accelerations/j2_components.png) All three acceleration components
  (X, Y, Z) vary periodically with time and remain within a narrow, symmetric range
  around zero throughout the simulation.


  3. (plots/j2_keplerian/raan_j2_comparison.png) The disturbed RAAN decreases overall
  over the 72-hour interval while the undisturbed curve stays nearly constant, and
  the difference curve shows a predominantly negative drift with small oscillations.

  '
