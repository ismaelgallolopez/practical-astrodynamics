  \        self,\n        xi: np.ndarray,\n        eta: np.ndarray,\n        l1: np.ndarray,\n\
  \        l2: np.ndarray,\n        m1: np.ndarray,\n        m2: np.ndarray,\n        n1:\
  \ np.ndarray,\n        n2: np.ndarray\n    ) -> np.ndarray:\n        \"\"\"\n        Transform\
  \ perifocal coordinates to inertial frame position.\n        \n        Args:\n         \
  \   xi: Perifocal x-coordinate [N] in km\n            eta: Perifocal y-coordinate [N] in\
  \ km\n            l1, l2, m1, m2, n1, n2: Rotation matrix elements [N]\n            \n \
  \       Returns:\n            Position vectors [N×3] in inertial frame in km\n        \"\
  \"\"\n        x = l1 * xi + l2 * eta\n        y = m1 * xi + m2 * eta\n        z = n1 * xi\
  \ + n2 * eta\n        \n        return np.column_stack([x, y, z])\n\n```\n"
