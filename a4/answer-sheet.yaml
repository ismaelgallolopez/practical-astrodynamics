ss_AEX_TBPObs_OIC_1: "\n1. (plots/tbp_accelerations/tbp_magnitude.png) Moon third-body\
  \ perturbations have higher magnitude than Sun third-body perturbations for the\
  \ simulation considered.\n\n2. (plots/tbp_keplerian/raan_tbp_comparison.png) The\
  \ disturbed RAAN slowly increases over the 72-hour interval, while the undisturbed\
  \ RAAN remains nearly constant. The difference curve shows a smooth positive drift.\n\
  \n3. (plots/tbp_accelerations/tbp_magnitude.png) Mean TBP acceleration magnitude\
  \ is approximately 8e-06 m/s^2, with the maximum and minimum values of approximately\
  \ 1e-05 m/s^2 and 5e-06 m/s^2, respectively.  \n"
ss_AEX_TBPInt_OIC_2: '

  1. The higher magnitude of the lunar TBP compared to the solar TBP indicates that,
  for this orbital geometry and time span, the Moon is the dominant third-body contributor
  to the perturbing acceleration.


  2. The positive drift of the RAAN difference suggests that third-body perturbations
  introduce a secular eastward rotation of the orbital plane over the 72-hour interval.


  3. The TBP acceleration magnitude varies within a relatively narrow band (from about
  5e-06 to 1.3e-05 m/s^2), so the applied perturbation remains of similar order throughout
  the simulation, leading to gradual rather than abrupt changes in the orbital elements.

  '
ss_AEX_TBPCon_OIC_4: '

  For near-GEO orbits, third-body perturbations from the Moon (and, to a lesser extent,
  the Sun) can dominate the perturbing acceleration budget and drive secular changes
  in angular elements such as RAAN and inclination, while acting with a slowly varying
  magnitude over each orbital period.

  '
ss_CEX_Explain_GEN_10: '

  Code excellence features:


  1. Dataclass Architecture: Python modules use @dataclass for KeplerianElements container
  with type hints (np.ndarray) and automatic __repr__ showing mean values, eliminating
  boilerplate constructors.


  2. Dual-Layer Plot Rendering: Transparent thick lines (alpha=0.3, linewidth=3, zorder=1)
  + crisp dotted lines (alpha=1.0, linestyle='':'', zorder=2) allow simultaneous trend
  magnitude and temporal detail visibility.


  3. External Legend Layout: bbox_to_anchor=(1.02, 1.0, 0.2, 0) positions legends
  in dedicated 22% right margin with plt.tight_layout(rect=[0, 0, 0.78, 1]) preventing
  data-legend overlap.


  4. Multi-Axis Scientific Notation: ax2.ticklabel_format(style=''scientific'', scilimits=(0,0))
  with tick_params(pad=25) prevents Y-axis label collisions on triple-Y-axis plots.


  5. Automated Directory Management: Plot scripts detect output path (plots/sgp4/
  vs plots/undisturbed/) based on data source using os.path.exists() checks with fallback
  logic.


  6. JPL Horizons API Integration: URL-encoded query strings (CENTER=''500@399'',
  EPHEM_TYPE=''VECTORS'', VEC_TABLE=''2'') with $$SOE/$$EOE marker parsing and regex
  r''GM.*=\s*([0-9.E+-]+)'' for header extraction.


  7. Fortran Regex Parameter Extraction: Python parses Fortran source files using
  r''parameter.*?J2.*?=\s*([0-9.E+-_]+)'' handling _dp suffixes, whitespace variations,
  and comment lines to auto-populate answer sheet.


  8. Unified Third-Body Data File: Single third_body_positions.txt with (x, y, z,
  GM_sun, GM_moon) format eliminates redundancy; SRP reads columns 1-3, TBP reads
  all columns.


  9. Julian Date Dual-Mode Conversion: julian_to_time_hours() handles both (N, 2)
  [jd, fr] arrays from NPZ and (N,) seconds arrays from TXT using ndim checks.


  10. Velocity Verlet Implementation: Fortran module with abstract interface for accel_func()
  supports both state-only and state+time acceleration functions via separate subroutines
  (velocity_verlet_integrate vs velocity_verlet_integrate_rv).


  11. Cross-Language Performance: Fortran propagation achieves <10ms for 259,200s
  (25,921 timesteps) while Python handles I/O and plotting, demonstrating appropriate
  compiled vs interpreted language selection.


  12. Comprehensive YAML Generation: 73 answer keys with automatic validation, scientific
  notation handling, and ordered dictionary (dict not OrderedDict) matching README
  structure.


  13. Modular Perturbation Architecture: Separate Fortran modules (j2_perturbation,
  srp_perturbation, drag_perturbation, third_body_perturbation) each with independent
  acceleration functions and runtime-read physical parameters.


  14. Organized Output Structure: Automated plots/{sgp4,undisturbed,j2_keplerian,srp_*,drag_*,tbp_*}/
  subdirectories with programmatic path.exists() and makedirs() creation.


  15. Conditional Compilation Shell Scripts: Timestamp comparison [ "src/*.f90" -nt
  "bin/*" ] implements GNU Make-style dependency checking without external build tools.

  '
ss_MDT_AI_GEN_0: '

  AI (GitHub Copilot) was used as a coding assistant throughout this assignment in
  the following ways:


  1. Code Structure: AI helped design the modular organization of Fortran modules
  and Python packages, suggesting separation of concerns and best practices for scientific
  computing projects.


  2. Debugging: When encountering issues with file parsing (e.g., GM values from Horizons,
  Sun position file format), AI helped identify regex patterns and parsing logic errors.


  3. Plot Formatting: AI suggested matplotlib techniques for dual y-axis plots, zorder
  layering for superimposed lines, and bbox_to_anchor for external legend positioning.


  4. Documentation: AI helped draft clear docstrings and comments explaining the physics
  and mathematics behind each perturbation model.

  '
