  coverage of the Pacific Ocean region between 165.8°W and 164.3°W longitude while oscillating
  13° north and south of the equator, providing continuous surveillance of the Asia-Pacific
  region including monitoring of intercontinental ballistic missile launch sites.
ss_CEX_Explain_GEN_10: 'MUNDANE FEATURES (0.5 points each):


  1. Systematic Docstrings: All modules, classes, and functions have comprehensive docstrings
  with Args/Returns sections following Google style guide.


  2. Organized Directory Structure: Separate data/ and plots/ directories with automatic creation,
  .gitkeep files to preserve structure in git.


  3. Automatic File Naming: Output files systematically named by content type (orbit_propagation.npz,
  keplerian_elements.npz, etc.).


  4. Module Import Pattern: All scripts use ''if __name__ == "__main__"'' allowing both standalone
  execution and module import for testing.


  5. Vector Operations: Avoided loops in favor of NumPy vectorized operations throughout (cartesian_to_keplerian
  processes 433 points simultaneously).


  6. Logical Code Organization: Separate files for each major task (propagation, conversion,
  plotting) with clear single responsibilities.


  7. Configuration File: config.yaml centralizes all parameters (physical constants, time
  domain, tolerances) separated from code logic.


  8. requirements.txt: Comprehensive pip requirements file with version specifications for
  reproducible environments.


  9. .gitignore: Excludes generated files (data/*.npz, plots/*.png, __pycache__) while preserving
  repository structure.


  10. Array Preallocation: All arrays initialized with proper size before computation (no
  append operations) for efficiency.


  11. Object-Oriented Programming: Three main classes (OrbitPropagator, KeplerianToCartesianConverter,
  CorotatingConverter) with clear interfaces and dataclass containers (KeplerianElements,
  CartesianState, CorotatingSphericalState).


  12. Type Hints Throughout: All function signatures include type annotations (np.ndarray,
  float, Tuple, etc.) enabling static analysis and IDE autocomplete.


  13. dataclass Usage: Four dataclasses (@dataclass decorator) for structured data with automatic
  __init__, __repr__, and type safety.


  14. config_loader.py Module: Type-safe configuration loading with dedicated dataclasses
  for each config section (PhysicsConfig, PropagationConfig, etc.) providing compile-time
  safety.


  15. Unit Testing (pytest): test_conversions.py with 11 test functions organized in 4 test
  classes, covering edge cases (circular, polar, highly eccentric orbits) and round-trip conversions.


  16. Automatic TLE Download: fetch_tle.py retrieves TLE data from Celestrak programmatically,
  falling back gracefully if network unavailable.


  17. Answer Key Extraction: extract_answer_keys.py uses regex to parse README.md and extract
  all answer keys programmatically, validates answer-sheet.yaml completeness.


  18. Benchmarking: benchmark.py profiles vectorized vs loop implementations, demonstrating
  10x+ speedup and identical numerical accuracy.


  19. Complete End-to-End Automation: run_all.sh and generate_answer_sheet.py orchestrate
  entire workflow from TLE fetch through answer sheet generation, extract source code via
  inspect module, handle all 49 answer keys automatically.


  20. GMST Implementation from Scratch: Manual implementation of IAU 1982 GMST formula for
  TEME→ECEF transformation without using restricted libraries, validated against Cartopy showing
  machine-precision agreement (residuals <1e-14°).


  21. Comprehensive Validation Framework: validate_corotating.py compares manual implementation
  against established library (Cartopy), generates side-by-side comparison plots with Earth
  features, computes and visualizes residuals proving numerical correctness.'
