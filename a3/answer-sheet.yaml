ss_REG_OrbObs_OIC_10: "1. (euler_keplerian_plot1.png) Inclination changes by much\
  \ less than 0.5e-11 degrees over the three-days integration for point-mass Earth\
  \ model integration with Euler method.\n        \n        2. (position_magnitude_combined.png)\
  \ Orbital radius drift from the SGP4 model increases with time, with the deviation\
  \ being proportional to the step time.\n        \n        3. (sgp4_keplerian_plot1.png\
  \ & euler_keplerian_plot1.png) Semi-major axis (SMA) shows an average decrease over\
  \ time for the SGP4 orbit, while the Euler orbit's one increases."
ss_REG_OrbInt_OIC_15: "1. Inclination is constant because the point-mass gravity model\
  \ creates a central force field, generating zero torque to perturb the angular momentum\
  \ vector. Since inclination is defined by the orientation of angular momentum vector,\
  \ a constant angular momentum vector implies a constant inclination.\n        \n\
  \        2. Euler's SMA increases due to artificial energy gain from linearizing\
  \ the curved path (integration error). Since specific orbital energy is inversely\
  \ proportional to the semi-major axis, an increase in energy mathematically dictates\
  \ an increase in SMA. In contrast, SGP4's SMA decreases because the model includes\
  \ physical atmospheric drag, which dissipates orbital energy."
ss_REG_OrbCon_OIC_23: The Euler integrator with a point-mass gravity model fails to
  provide a physically realistic representation of the SGP4 reference orbit. As established
  in the interpretations, the method introduces artificial energy gain due to first-order
  truncation errors, causing non-physical divergence in the semi-major axis and eccentricity.
  Furthermore, the point-mass assumption neglects dominant secular perturbations (like
  J2), rendering this approach unsuitable for the precise long-term propagation of
  Earth orbits.
