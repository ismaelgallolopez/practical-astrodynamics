ss_REG_FEEDBACK_GEN_0: I do not see the point in implementing a optimizer when all (of most) of us do it with AI just to pass
  the assignment and really take no learning from it. It is impossible to get a good perspective (in my opinion) on numerical
  optimization with just a lecture on that plus an assignment and never touching it again. Some of us already did optimization
  courses and have some experience but otherwise it is just an artifact of this assignment.
