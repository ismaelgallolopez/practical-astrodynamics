ss_REG_SGP4_CODE_4: "main.py:\n\n```python\ndef sgp4_propagate(tle, ti, tf, dt):\n    \"\"\
  \"Propagate orbit using SGP4 with vectorized array operations.\n    \n    Args:\n      \
  \  tle: Tuple of (name, line1, line2) TLE data\n        ti: Start time in seconds from TLE\
  \ epoch\n        tf: End time in seconds from TLE epoch\n        dt: Time step in seconds\n\
  \    \n    Returns:\n        Tuple of (errors, positions, velocities, jd_array, fr_array,\
  \ satellite, times_seconds)\n        - errors: (N,) array of error codes\n        - positions:\
  \ (N, 3) array of positions [km] in TEME frame\n        - velocities: (N, 3) array of velocities\
  \ [km/s] in TEME frame\n        - jd_array: (N, 1) array of Julian date whole parts\n  \
  \      - fr_array: (N, 1) array of Julian date fractional parts (days from epoch)\n    \
  \    - satellite: Satrec object\n        - times_seconds: (N, 1) array of times in seconds\
  \ from epoch\n    \"\"\"\n    sat = Satrec.twoline2rv(tle[1], tle[2])\n\n    # Time vector\
  \ in seconds from TLE epoch\n    times_seconds = np.arange(ti, tf + dt, dt, dtype=float)\
  \  # shape (N,)\n\n    # Full Julian date at each step (including fractional epoch!)\n \
  \   epoch_jd = sat.jdsatepoch + sat.jdsatepochF\n    jd_full = epoch_jd + times_seconds\
  \ / 86400.0             # shape (N,)\n\n    # Split into integer + fractional parts for\
  \ sgp4_array\n    jd_int = np.floor(jd_full).astype(float)\n    jd_frac = jd_full - jd_int\n\
  \n    # Propagate\n    e, r_km, v_km_s = sat.sgp4_array(jd_int, jd_frac)\n    assert np.all(e\
  \ == 0), f\"SGP4 failed at {np.sum(e != 0)} epochs out of {len(e)}\"\n\n    return e, r_km,\
  \ v_km_s, jd_int, jd_frac, sat, times_seconds\n\n```\n"
