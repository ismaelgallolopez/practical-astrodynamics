ss_REG_OrbKepResPlot_CODE_1: "#!/usr/bin/env python3\n\"\"\"\nPlot Keplerian elements and residuals for SGP4, integrated,\
  \ and optimized orbits.\n\"\"\"\n\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom pathlib import Path\n\n# Gravitational\
  \ parameter for Earth (m^3/s^2)\nMU = 3.986004418e14\n\ndef cart_to_kep(r, v, mu=MU):\n    \"\"\"\n    Convert Cartesian\
  \ state (position, velocity) to Keplerian elements.\n    \n    Parameters:\n    -----------\n    r : array_like (3,)\n \
  \       Position vector [m]\n    v : array_like (3,)\n        Velocity vector [m/s]\n    mu : float\n        Gravitational\
  \ parameter [m^3/s^2]\n        \n    Returns:\n    --------\n    kep : dict\n        Keplerian elements:\n        - a: semi-major\
  \ axis [km]\n        - e: eccentricity [-]\n        - i: inclination [deg]\n        - raan: right ascension of ascending\
  \ node [deg]\n        - argp: argument of perigee [deg]\n        - nu: true anomaly [deg]\n    \"\"\"\n    r = np.array(r)\n\
  \    v = np.array(v)\n    \n    # Magnitude\n    r_mag = np.linalg.norm(r)\n    v_mag = np.linalg.norm(v)\n    \n    # Specific\
  \ angular momentum\n    h = np.cross(r, v)\n    h_mag = np.linalg.norm(h)\n    \n    # Node vector\n    k = np.array([0,\
  \ 0, 1])\n    n = np.cross(k, h)\n    n_mag = np.linalg.norm(n)\n    \n    # Eccentricity vector\n    e_vec = ((v_mag**2\
  \ - mu/r_mag) * r - np.dot(r, v) * v) / mu\n    e = np.linalg.norm(e_vec)\n    \n    # Specific orbital energy\n    epsilon\
  \ = v_mag**2 / 2 - mu / r_mag\n    \n    # Semi-major axis\n    if abs(e - 1.0) > 1e-10:  # Not parabolic\n        a = -mu\
  \ / (2 * epsilon)\n    else:\n        a = np.inf\n    \n    # Inclination\n    i = np.arccos(h[2] / h_mag)\n    \n    #\
  \ RAAN\n    if n_mag > 1e-10:\n        raan = np.arccos(n[0] / n_mag)\n        if n[1] < 0:\n            raan = 2 * np.pi\
  \ - raan\n    else:\n        raan = 0.0\n    \n    # Argument of perigee\n    if n_mag > 1e-10 and e > 1e-10:\n        argp\
  \ = np.arccos(np.dot(n, e_vec) / (n_mag * e))\n        if e_vec[2] < 0:\n            argp = 2 * np.pi - argp\n    else:\n\
  \        argp = 0.0\n    \n    # True anomaly\n    if e > 1e-10:\n        nu = np.arccos(np.dot(e_vec, r) / (e * r_mag))\n\
  \        if np.dot(r, v) < 0:\n            nu = 2 * np.pi - nu\n    else:\n        nu = 0.0\n    \n    return {\n      \
  \  'a': a / 1000.0,  # Convert to km\n        'e': e,\n        'i': np.degrees(i),\n        'raan': np.degrees(raan),\n\
  \        'argp': np.degrees(argp),\n        'nu': np.degrees(nu)\n    }\n\ndef load_orbit_data(filename):\n    \"\"\"Load\
  \ orbit data from file.\"\"\"\n    data = np.loadtxt(filename, comments='#')\n    times = data[:, 0]\n    positions = data[:,\
  \ 1:4]\n    velocities = data[:, 4:7]\n    return times, positions, velocities\n\ndef compute_keplerian_elements(times,\
  \ positions, velocities):\n    \"\"\"Compute Keplerian elements for all time steps.\"\"\"\n    n_steps = len(times)\n  \
  \  kep_elements = {\n        'a': np.zeros(n_steps),\n        'e': np.zeros(n_steps),\n        'i': np.zeros(n_steps),\n\
  \        'raan': np.zeros(n_steps),\n        'argp': np.zeros(n_steps),\n        'nu': np.zeros(n_steps)\n    }\n    \n\
  \    for i in range(n_steps):\n        kep = cart_to_kep(positions[i], velocities[i])\n        for key in kep_elements:\n\
  \            kep_elements[key][i] = kep[key]\n    \n    return kep_elements\n\ndef main():\n    print(\"=\"*60)\n    print(\"\
  Keplerian Elements and Residuals Analysis\")\n    print(\"=\"*60)\n    print()\n    \n    # Load orbit data\n    print(\"\
  Loading orbit data...\")\n    \n    # Load SGP4 orbit\n    print(\"  - Loading SGP4 orbit...\")\n    sgp4_data = np.load('data/sgp4_reference/orbit_propagation.npz')\n\
  \    times_jd = sgp4_data['times_jd']\n    # Convert Julian date to seconds from start (JD is in two parts: integer and\
  \ fraction)\n    jd_full = times_jd[:, 0] + times_jd[:, 1]\n    sgp4_times = (jd_full - jd_full[0]) * 86400.0  # JD to seconds\n\
  \    sgp4_positions = sgp4_data['positions'] * 1000.0  # km to m\n    sgp4_velocities = sgp4_data['velocities'] * 1000.0\
  \  # km/s to m/s\n    \n    # Load integrated orbit\n    print(\"  - Loading integrated orbit...\")\n    times_int, pos_int,\
  \ vel_int = load_orbit_data('data/outputs_all/integrated_orbit.txt')\n    \n    # Load optimized orbit\n    print(\"  -\
  \ Loading optimized orbit...\")\n    times_opt, pos_opt, vel_opt = load_orbit_data('data/outputs_all/optimized_orbit.txt')\n\
  \    \n    # Compute Keplerian elements\n    print()\n    print(\"Computing Keplerian elements...\")\n    print(\"  - SGP4\
  \ orbit...\")\n    kep_sgp4 = compute_keplerian_elements(sgp4_times, sgp4_positions, sgp4_velocities)\n    \n    print(\"\
  \  - Integrated orbit...\")\n    kep_int = compute_keplerian_elements(times_int, pos_int, vel_int)\n    \n    print(\" \
  \ - Optimized orbit...\")\n    kep_opt = compute_keplerian_elements(times_opt, pos_opt, vel_opt)\n    \n    # Interpolate\
  \ integrated and optimized orbits to SGP4 times for fair comparison\n    print()\n    print(\"Interpolating orbits to common\
  \ time domain...\")\n    kep_int_interp = {}\n    kep_opt_interp = {}\n    for key in ['a', 'e', 'i', 'raan', 'argp', 'nu']:\n\
  \        kep_int_interp[key] = np.interp(sgp4_times, times_int, kep_int[key])\n        kep_opt_interp[key] = np.interp(sgp4_times,\
  \ times_opt, kep_opt[key])\n    \n    # Compute argument of latitude (true anomaly + argument of periapsis)\n    u_sgp4\
  \ = kep_sgp4['nu'] + kep_sgp4['argp']\n    u_int = kep_int_interp['nu'] + kep_int_interp['argp']\n    u_opt = kep_opt_interp['nu']\
  \ + kep_opt_interp['argp']\n    \n    # Convert times to hours\n    times_sgp4_hr = sgp4_times / 3600.0\n    \n    # Create\
  \ plots\n    print()\n    print(\"Creating plots...\")\n    \n    # Define the 5 elements to plot\n    elements_to_plot\
  \ = [\n        ('i', 'Inclination', '[deg]', kep_sgp4['i'], kep_int_interp['i'], kep_opt_interp['i']),\n        ('e', 'Eccentricity',\
  \ '[-]', kep_sgp4['e'], kep_int_interp['e'], kep_opt_interp['e']),\n        ('a', 'Semi-major Axis', '[km]', kep_sgp4['a'],\
  \ kep_int_interp['a'], kep_opt_interp['a']),\n        ('u', 'Argument of Latitude', '[deg]', u_sgp4, u_int, u_opt),\n  \
  \      ('raan', 'RAAN', '[deg]', kep_sgp4['raan'], kep_int_interp['raan'], kep_opt_interp['raan'])\n    ]\n    \n    output_files\
  \ = []\n    \n    for key, name, unit, sgp4_vals, int_vals, opt_vals in elements_to_plot:\n        print(f\"  - Creating\
  \ plot for {name}...\")\n        \n        fig, ax1 = plt.subplots(figsize=(12, 7))\n        \n        # Primary y-axis:\
  \ Plot the three orbits\n        ax1.set_xlabel('Time [hours]', fontsize=12, fontweight='bold')\n        ax1.set_ylabel(f'{name}\
  \ {unit}', fontsize=12, fontweight='bold', color='black')\n        \n        line1 = ax1.plot(times_sgp4_hr, sgp4_vals,\
  \ 'b-', label='SGP4', \n                        linewidth=2, alpha=0.8)\n        line2 = ax1.plot(times_sgp4_hr, int_vals,\
  \ 'g--', label='Integrated', \n                        linewidth=1.5, alpha=0.7)\n        line3 = ax1.plot(times_sgp4_hr,\
  \ opt_vals, 'r:', label='Optimized', \n                        linewidth=1.5, alpha=0.7)\n        \n        ax1.tick_params(axis='y',\
  \ labelcolor='black')\n        ax1.grid(True, alpha=0.3)\n        \n        # Secondary y-axis: Plot the differences\n \
  \       ax2 = ax1.twinx()\n        ax2.set_ylabel(f'{name} Difference {unit}', fontsize=12, fontweight='bold', color='purple')\n\
  \        \n        # Compute residuals\n        residual_int = int_vals - sgp4_vals\n        residual_opt = opt_vals - sgp4_vals\n\
  \        \n        # Handle angle wrapping for angular elements\n        if key in ['i', 'u', 'raan', 'argp', 'nu']:\n \
  \           residual_int = np.arctan2(np.sin(np.radians(residual_int)), \n                                     np.cos(np.radians(residual_int)))\n\
  \            residual_int = np.degrees(residual_int)\n            \n            residual_opt = np.arctan2(np.sin(np.radians(residual_opt)),\
  \ \n                                     np.cos(np.radians(residual_opt)))\n            residual_opt = np.degrees(residual_opt)\n\
  \        \n        line4 = ax2.plot(times_sgp4_hr, residual_int, 'm-', \n                        label='Integrated - SGP4',\
  \ linewidth=1.5, alpha=0.7)\n        line5 = ax2.plot(times_sgp4_hr, residual_opt, 'orange', linestyle='-',\n          \
  \              label='Optimized - SGP4', linewidth=1.5, alpha=0.7)\n        \n        ax2.tick_params(axis='y', labelcolor='purple')\n\
  \        ax2.axhline(0, color='gray', linestyle='--', alpha=0.5, linewidth=1)\n        \n        # Title\n        plt.title(f'{name}\
  \ Comparison: SGP4 vs Integrated vs Optimized', \n                 fontsize=14, fontweight='bold', pad=20)\n        \n \
  \       # Combined legend\n        lines = line1 + line2 + line3 + line4 + line5\n        labels = [l.get_label() for l\
  \ in lines]\n        ax1.legend(lines, labels, loc='upper left', bbox_to_anchor=(1.15, 1), \n                  framealpha=0.95,\
  \ fontsize=9, edgecolor='gray')\n        \n        # Adjust layout\n        plt.tight_layout(rect=[0, 0, 0.88, 0.96])\n\
  \        \n        # Save figure\n        output_file = f'plots/keplerian/{key}_comparison.png'\n        Path(output_file).parent.mkdir(parents=True,\
  \ exist_ok=True)\n        plt.savefig(output_file, dpi=300, bbox_inches='tight')\n        print(f\"    Saved: {output_file}\"\
  )\n        output_files.append(output_file)\n        plt.close(fig)\n        \n        # Print statistics\n        rms_int\
  \ = np.sqrt(np.mean(residual_int**2))\n        rms_opt = np.sqrt(np.mean(residual_opt**2))\n        print(f\"    {key.upper()}:\
  \ RMS error (Integrated) = {rms_int:.6e}, RMS error (Optimized) = {rms_opt:.6e}\")\n    \n    print()\n    print(\"=\"*60)\n\
  \    print(\"Analysis complete!\")\n    print(f\"Created {len(output_files)} plots\")\n    print(\"=\"*60)\n\nif __name__\
  \ == '__main__':\n    main()\n"
