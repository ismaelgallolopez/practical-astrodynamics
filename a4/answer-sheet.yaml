ss_AEX_TBP_CODE_0.8: "\nsubroutine third_body_acceleration(r, r_sun, r_moon, a_tbp)\n\
  \    real(8), intent(in) :: r(3), r_sun(3), r_moon(3)\n    real(8), intent(out)\
  \ :: a_tbp(3)\n    real(8) :: r_sun_sat(3), r_moon_sat(3), d_sun, d_moon, d_sun_sat,\
  \ d_moon_sat\n    real(8), parameter :: GM_SUN = 1.327124400419e+20\n    real(8),\
  \ parameter :: GM_MOON = 4.902800066000e+12\n    \n    ! Sun perturbation\n    r_sun_sat\
  \ = r_sun - r\n    d_sun = sqrt(r_sun(1)**2 + r_sun(2)**2 + r_sun(3)**2)\n    d_sun_sat\
  \ = sqrt(r_sun_sat(1)**2 + r_sun_sat(2)**2 + r_sun_sat(3)**2)\n    \n    ! Moon\
  \ perturbation\n    r_moon_sat = r_moon - r\n    d_moon = sqrt(r_moon(1)**2 + r_moon(2)**2\
  \ + r_moon(3)**2)\n    d_moon_sat = sqrt(r_moon_sat(1)**2 + r_moon_sat(2)**2 + r_moon_sat(3)**2)\n\
  \    \n    ! Total third body acceleration\n    a_tbp = GM_SUN * (r_sun_sat/d_sun_sat**3\
  \ - r_sun/d_sun**3) + &\n            GM_MOON * (r_moon_sat/d_moon_sat**3 - r_moon/d_moon**3)\n\
  end subroutine third_body_acceleration\n"
