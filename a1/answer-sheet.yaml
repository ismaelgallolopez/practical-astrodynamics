ss_REG_OrbPlot_CODE_7: "plot_orbit.py:\n\n```python\ndef plot_groundtrack(positions, times_jd,\
  \ sat_name, output_prefix='plots/orbit'):\n    \"\"\"Plot satellite groundtrack on Earth\
  \ map with proper Earth rotation.\n    \n    Args:\n        positions: (N, 3) array of positions\
  \ in TEME frame [km]\n        times_jd: (N, 2) array of Julian dates [jd_whole, jd_frac]\n\
  \        sat_name: Satellite name for title\n        output_prefix: Prefix for output filenames\n\
  \    \"\"\"\n    # Convert TEME to ECEF (accounting for Earth rotation)\n    positions_ecef\
  \ = teme_to_ecef(positions, times_jd)\n    \n    # Convert ECEF to lat/lon\n    latitude,\
  \ longitude = ecef_to_latlon(positions_ecef)\n    \n    # Create figure with PlateCarree\
  \ projection\n    fig = plt.figure(figsize=(16, 9))\n    ax = plt.axes(projection=ccrs.PlateCarree())\n\
  \    \n    # Add map features\n    ax.add_feature(cfeature.LAND, facecolor='lightgray',\
  \ alpha=0.5)\n    ax.add_feature(cfeature.OCEAN, facecolor='lightblue', alpha=0.5)\n   \
  \ ax.add_feature(cfeature.COASTLINE, linewidth=0.5)\n    ax.add_feature(cfeature.BORDERS,\
  \ linewidth=0.3, alpha=0.5)\n    ax.gridlines(draw_labels=True, linewidth=0.5, alpha=0.5,\
  \ linestyle='--')\n    \n    # Plot groundtrack - handle longitude wrapping\n    # Split\
  \ into segments where longitude wraps around\n    lon_diff = np.diff(longitude)\n    wrap_indices\
  \ = np.where(np.abs(lon_diff) > 180)[0]\n    \n    # Plot in segments\n    start_idx = 0\n\
  \    for wrap_idx in wrap_indices:\n        ax.plot(longitude[start_idx:wrap_idx+1], latitude[start_idx:wrap_idx+1],\n\
  \                'r-', linewidth=2, transform=ccrs.Geodetic(), alpha=0.8)\n        start_idx\
  \ = wrap_idx + 1\n    \n    # Plot final segment\n    ax.plot(longitude[start_idx:], latitude[start_idx:],\n\
  \            'r-', linewidth=2, transform=ccrs.Geodetic(), alpha=0.8, label='Ground Track')\n\
  \    \n    # Get time range for title\n    start_time = jd_to_datetime(times_jd[0, 0], times_jd[0,\
  \ 1])\n    end_time = jd_to_datetime(times_jd[-1, 0], times_jd[-1, 1])\n    duration_hours\
  \ = (end_time - start_time).total_seconds() / 3600\n    \n    ax.set_title(f'Ground Track\
  \ - {sat_name}\\n' +\n                f'{start_time.strftime(\"%Y-%m-%d %H:%M\")} to {end_time.strftime(\"\
  %H:%M UTC\")} ' +\n                f'({duration_hours:.1f} hours)',\n                fontsize=14,\
  \ fontweight='bold', pad=20)\n    \n    ax.legend(loc='lower left', fontsize=11, framealpha=0.9)\n\
  \    ax.set_extent([-180, 180, -90, 90], crs=ccrs.PlateCarree())\n    \n    plt.tight_layout()\n\
  \    filename = f'{output_prefix}_groundtrack.png'\n    plt.savefig(filename, dpi=300, bbox_inches='tight')\n\
  \    print(f'Saved: {filename}')\n    plt.close()\n\n```\n"
