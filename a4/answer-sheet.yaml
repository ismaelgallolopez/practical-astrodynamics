  1. Because the argument of latitude curves overlap entirely, the J2 perturbation
  does not produce a visible change in the argument of latitude over the simulated
  period.


  2. The periodic nature of the acceleration components together with the steadily
  decreasing RAAN difference indicates that J2 introduces bounded short-term variations
  but also produces a consistent long-term change in RAAN.

  '
